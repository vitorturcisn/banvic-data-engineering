airflowVersion: "3.2.2"

defaultAirflowRepository: banvic-airflow
defaultAirflowTag: "2.1.0"

executor: LocalExecutor

apiSecretKeySecretName: airflow-api-static-secret
jwtSecretName: airflow-jwt-secret
fernetKeySecretName: airflow-fernet

extraEnv: |
  - name: AIRFLOW__CORE__PARALLELISM
    value: "2"

  - name: AIRFLOW__CORE__LOAD_EXAMPLES
    value: "False"

  - name: AIRFLOW__CORE__AUTH_MANAGER
    value: "airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager"

postgresql:
  enabled: false

redis:
  enabled: false

pgbouncer:
  enabled: false

data:
  metadataSecretName: airflow-metadata

createUserJob:
  enabled: false
  defaultUser:
    enabled: false

migrateDatabaseJob:
  enabled: true
  useHelmHooks: false
  applyCustomEnv: false

  env:
   - name: AIRFLOW__CORE__AUTH_MANAGER
     value: "airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager"

  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"

dags:
  persistence:
    enabled: false
  gitSync:
    enabled: false

logs:
  persistence:
    enabled: true
    existingClaim: airflow-logs-pvc

triggerer:
  enabled: false

apiServer:
  startupProbe:
    initialDelaySeconds: 0
    timeoutSeconds: 20
    failureThreshold: 18
    periodSeconds: 10
    scheme: HTTP

  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

scheduler:
  startupProbe:
    initialDelaySeconds: 0
    timeoutSeconds: 60
    failureThreshold: 12
    periodSeconds: 10

  livenessProbe:
    initialDelaySeconds: 30
    timeoutSeconds: 60
    failureThreshold: 5
    periodSeconds: 60

  resources:
    limits:
      cpu: "2"
      memory: 1536Mi
    requests:
      cpu: 500m
      memory: 768Mi

  env:
    # Connection usada pelo PostgresHook na DAG.
    - name: AIRFLOW_CONN_BANVIC_POSTGRES
      valueFrom:
        secretKeyRef:
          name: banvic-airflow-ingest
          key: AIRFLOW_CONN_BANVIC_POSTGRES

    # Connection usada pelos FileSensors.
    - name: AIRFLOW_CONN_FS_DEFAULT
      valueFrom:
        secretKeyRef:
          name: airflow-filesystem
          key: connection

    # Variáveis consumidas pelo target-postgres do Meltano.
    # Disponibilizadas somente no Scheduler.
    - name: TARGET_POSTGRES_HOST
      value: banvic-postgres.banvic.svc.cluster.local

    - name: TARGET_POSTGRES_PORT
      value: "5432"

    - name: TARGET_POSTGRES_DATABASE
      value: banvic

    - name: TARGET_POSTGRES_USER
      valueFrom:
        secretKeyRef:
          name: banvic-postgres-ingest
          key: POSTGRES_USER

    - name: TARGET_POSTGRES_PASSWORD
      valueFrom:
        secretKeyRef:
          name: banvic-postgres-ingest
          key: POSTGRES_PASSWORD

  # Somente o Scheduler precisa acessar os CSVs.
  extraVolumes:
    - name: banvic-raw-data
      persistentVolumeClaim:
        claimName: banvic-raw-data-pvc

  extraVolumeMounts:
    - name: banvic-raw-data
      mountPath: /opt/airflow/data/raw
      readOnly: true

dagProcessor:
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

statsd:
  enabled: false

flower:
  enabled: false